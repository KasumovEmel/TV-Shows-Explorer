Show:
  type: object
  required: [id, originalTitle, genres]
  properties:
    id: { type: string, pattern: '^[1-9][0-9]*$' }
    originalTitle: { type: string }
    genres: { type: array, items: { type: string } }
    year: { type: integer }
    summary: { type: string, maxLength: 160 }
    rating: { type: number }
    poster: { type: string }
SearchPage:
  type: object
  required: [items, genres, page, pageSize, totalBeforeFilter, totalAfterFilter]
  properties:
    items: { type: array, items: { $ref: '#/Show' } }
    genres: { type: array, items: { type: string } }
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, enum: [3] }
    totalBeforeFilter: { type: integer, minimum: 0 }
    totalAfterFilter: { type: integer, minimum: 0 }
Favorites:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: '#/Show' } }
ApiError:
  type: object
  required: [code, message]
  properties:
    code: { type: string }
    message: { type: string }
