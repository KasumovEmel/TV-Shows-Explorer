openapi: 3.0.3
info:
  title: Season One API
  version: 1.0.0
paths:
  /api/shows:
    $ref: './paths/shows.yaml'
  /api/favorites:
    $ref: './paths/favorites.yaml'
  /api/favorites/{showId}:
    $ref: './paths/favorite.yaml'
  /api/health:
    $ref: './paths/health.yaml'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: season_one
      description: Anonymous session created on first favorites request, valid for 30 days.
  schemas:
    Show:
      $ref: './models.yaml#/Show'
    SearchPage:
      $ref: './models.yaml#/SearchPage'
    Favorites:
      $ref: './models.yaml#/Favorites'
    ApiError:
      $ref: './models.yaml#/ApiError'
