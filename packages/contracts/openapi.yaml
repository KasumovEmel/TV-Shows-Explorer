openapi: 3.0.3
info:
  title: Season One API
  version: 1.0.0
paths:
  /api/shows:
    $ref: './paths/shows.yaml'
  /api/auth/login:
    $ref: './paths/login.yaml'
  /api/auth/session:
    $ref: './paths/session.yaml'
  /api/auth/logout:
    $ref: './paths/logout.yaml'
  /api/favorites:
    $ref: './paths/favorites.yaml'
  /api/favorites/count:
    $ref: './paths/favorites-count.yaml'
  /api/favorites/{showId}:
    $ref: './paths/favorite.yaml'
  /api/health:
    $ref: './paths/health.yaml'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: season_one
      description: Email login session. Ends on logout, expiry after 30 days, or server restart.
  schemas:
    Show:
      $ref: './models.yaml#/Show'
    SearchPage:
      $ref: './models.yaml#/SearchPage'
    Favorites:
      $ref: './models.yaml#/Favorites'
    ApiError:
      $ref: './models.yaml#/ApiError'
