get:
  operationId: countFavorites
  security: [{ session: [] }]
  responses:
    '401': { $ref: '../errors.yaml#/E401' }
    '200':
      description: Number of saved shows in the current user's list.
      content:
        application/json:
          schema:
            type: object
            required: [count]
            properties:
              count: { type: integer, minimum: 0 }
    '500': { $ref: '../errors.yaml#/E500' }
