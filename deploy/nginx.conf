# Enable after the port and DNS checks in deploy/README.md and certificate issuance.
server {
    listen 443 ssl;
    server_name season-one.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/season-one.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/season-one.duckdns.org/privkey.pem;
    root /srv/season-one/current/web;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 = @api_down;
    }
    location @api_down {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"code":"storage_unavailable","message":"API unavailable"}';
    }
    location = /revision.txt { add_header Cache-Control no-store; }
    location /static/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control no-cache; }
}
